name: Deploy website to GitHub Pages
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Build site
        run: bundle exec jekyll build --strict_front_matter --trace
        env:
          JEKYLL_ENV: production
      - name: Verify site
        run: bundle exec ruby scripts/check_site.rb
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check GitHub Pages configuration
        uses: actions/configure-pages@v6
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify published pages
        uses: actions/github-script@v8
        with:
          script: |
            for (const path of ['', 'research/', 'teaching/']) {
              const url = new URL(path, 'https://eojin-han.github.io/');
              url.searchParams.set('verify', context.sha);
              const response = await fetch(url, {cache: 'no-store', signal: AbortSignal.timeout(30000)});
              const html = await response.text();
              if (!response.ok || !html.includes('Eojin Han')) {
                throw new Error(`Published page failed verification: ${path || '/'} (HTTP ${response.status})`);
              }
              core.notice(`${path || '/'}: HTTP ${response.status}, site content verified`);
            }
