name: Inspect Pages deployment
on:
  push:
    paths: ['.github/workflows/pages-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const pages = await github.request('GET /repos/{owner}/{repo}/pages', repo);
            core.notice(JSON.stringify({status: pages.data.status, build_type: pages.data.build_type, html_url: pages.data.html_url, cname: pages.data.cname, source: pages.data.source}), {title: 'Pages configuration'});
            const jobs = await github.rest.actions.listJobsForWorkflowRun({...repo, run_id: 42269146538});
            const job = jobs.data.jobs.find(j => j.name === 'deploy');
            const logs = await github.rest.actions.downloadJobLogsForWorkflowRun({...repo, job_id: job.id});
            const text = typeof logs.data === 'string' ? logs.data : JSON.stringify(logs.data);
            core.notice(text.split('\n').filter(line => /Created deployment|Current status:|Deployment failed|Error:/.test(line)).join('\n'), {title: 'Previous deployment response'});
            const match = text.match(/Created deployment for [a-f0-9]+, ID: ([a-zA-Z0-9_-]+)/);
            if (match) {
              const result = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {...repo, deployment_id: match[1]});
              core.notice(JSON.stringify(result.data), {title: 'Pages deployment status'});
            }
